<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">工程与扩展</title>
  <desc id="desc">Code Reviewer 工程扩展看板，展示模型服务、Agent 并发、运行时加固、评测吞吐和有效样本。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.56" stop-color="#08111F"/>
      <stop offset="1" stop-color="#051B1F"/>
    </linearGradient>
    <linearGradient id="panel" x1="42" y1="36" x2="1158" y2="684" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#07131F"/>
    </linearGradient>
    <linearGradient id="modelFill" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="toolFill" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#334155" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="testFill" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="throughputFill" x1="394" y1="522" x2="800" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="144%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
    <style>
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      .title { fill: #F8FAFC; font-size: 38px; font-weight: 840; letter-spacing: 0; }
      .subtitle { fill: #94A3B8; font-size: 17px; font-weight: 650; }
      .panel-title { fill: #E2E8F0; font-size: 18px; font-weight: 820; }
      .label { fill: #CBD5E1; font-size: 14px; font-weight: 720; }
      .small { fill: #94A3B8; font-size: 12px; font-weight: 620; }
      .tiny { fill: #94A3B8; font-size: 10px; font-weight: 620; }
      .micro { fill: #94A3B8; font-size: 11px; font-weight: 620; }
      .big { fill: #FFFFFF; font-size: 42px; font-weight: 880; }
      .gain { fill: #A7F3D0; font-size: 32px; font-weight: 880; }
      .mid { fill: #FFFFFF; font-size: 28px; font-weight: 840; }
      .card { fill: #0B1220; stroke: #26364B; stroke-width: 1.2; }
      .chip { fill: #111827; stroke: #334155; stroke-width: 1; }
      .line { stroke: #334155; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <rect x="42" y="36" width="1116" height="648" rx="28" fill="url(#panel)" stroke="#1E293B"/>
  <path d="M42 136H1158" stroke="#1E293B"/>

  <text x="82" y="93" class="title">工程与扩展</text>
  <text x="82" y="122" class="subtitle">Model Serving · Concurrency · Runtime</text>

  <g filter="url(#shadow)">
    <rect x="70" y="166" width="280" height="498" rx="24" class="card"/>
    <text x="100" y="206" class="panel-title">模型服务</text>
    <text x="100" y="229" class="small">本地 vLLM 服务</text>

    <rect x="100" y="260" width="220" height="64" rx="18" fill="#0F172A" stroke="#2563EB"/>
    <text x="120" y="287" class="small">GPU</text>
    <text x="120" y="311" class="mid">A800 80GB</text>

    <rect x="100" y="342" width="220" height="48" rx="16" class="chip"/>
    <text x="120" y="371" class="label">code-reviewer-8B</text>

    <rect x="100" y="406" width="102" height="48" rx="16" class="chip"/>
    <text x="124" y="436" class="label">vLLM</text>
    <rect x="218" y="406" width="102" height="48" rx="16" class="chip"/>
    <text x="238" y="436" class="label">BF16</text>

    <rect x="100" y="470" width="220" height="56" rx="17" fill="#0C1B2A" stroke="#0891B2"/>
    <text x="120" y="493" class="small">上下文窗口</text>
    <text x="120" y="516" class="mid">131K</text>

    <rect x="100" y="542" width="220" height="44" rx="14" class="chip"/>
    <text x="120" y="570" class="label">原生 Tool Calling</text>

    <rect x="100" y="602" width="96" height="34" rx="13" class="chip"/>
    <text x="120" y="624" class="small">TP = 1</text>
    <rect x="210" y="602" width="110" height="34" rx="13" class="chip"/>
    <text x="230" y="624" class="small">显存 0.90</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="374" y="166" width="446" height="498" rx="24" class="card"/>
    <text x="404" y="206" class="panel-title">并发执行</text>
    <text x="404" y="229" class="small">Agent / vLLM 协同</text>
    <circle cx="636" cy="224" r="5" fill="#38BDF8"/>
    <text x="648" y="228" class="small">Model</text>
    <circle cx="700" cy="224" r="5" fill="#8B5CF6"/>
    <text x="712" y="228" class="small">Tool</text>
    <circle cx="758" cy="224" r="5" fill="#14B8A6"/>
    <text x="770" y="228" class="small">Test</text>

    <rect x="404" y="254" width="150" height="44" rx="16" fill="#101827" stroke="#334155"/>
    <text x="424" y="281" class="label">Agent 队列</text>
    <rect x="630" y="254" width="150" height="44" rx="16" fill="#0C1B2A" stroke="#06B6D4"/>
    <text x="654" y="274" class="small">vLLM</text>
    <text x="654" y="290" class="label">运行 ≤ 3</text>

    <path d="M556 276H620" class="line"/>
    <path d="M620 276L612 270M620 276L612 282" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

    <text x="404" y="338" class="label">Agent A</text>
    <rect x="480" y="316" width="64" height="34" rx="12" fill="url(#modelFill)" stroke="#38BDF8"/>
    <text x="512" y="338" text-anchor="middle" class="small" fill="#DBEAFE">Model</text>
    <rect x="558" y="316" width="64" height="34" rx="12" fill="url(#toolFill)" stroke="#8B5CF6"/>
    <text x="590" y="338" text-anchor="middle" class="small">Tool</text>
    <rect x="636" y="316" width="64" height="34" rx="12" fill="url(#modelFill)" stroke="#38BDF8"/>
    <text x="668" y="338" text-anchor="middle" class="small" fill="#DBEAFE">Model</text>
    <rect x="714" y="316" width="64" height="34" rx="12" fill="url(#testFill)" stroke="#14B8A6"/>
    <text x="746" y="338" text-anchor="middle" class="small" fill="#CCFBF1">Test</text>

    <text x="404" y="402" class="label">Agent B</text>
    <rect x="480" y="380" width="64" height="34" rx="12" fill="url(#toolFill)" stroke="#8B5CF6"/>
    <text x="512" y="402" text-anchor="middle" class="small">Tool</text>
    <rect x="558" y="380" width="64" height="34" rx="12" fill="url(#modelFill)" stroke="#38BDF8"/>
    <text x="590" y="402" text-anchor="middle" class="small" fill="#DBEAFE">Model</text>
    <rect x="636" y="380" width="64" height="34" rx="12" fill="#172033" stroke="#475569"/>
    <text x="668" y="402" text-anchor="middle" class="small">Tool</text>
    <rect x="714" y="380" width="64" height="34" rx="12" fill="url(#modelFill)" stroke="#38BDF8"/>
    <text x="746" y="402" text-anchor="middle" class="small" fill="#DBEAFE">Model</text>

    <text x="404" y="466" class="label">Agent C</text>
    <rect x="480" y="444" width="64" height="34" rx="12" fill="url(#modelFill)" stroke="#38BDF8"/>
    <text x="512" y="466" text-anchor="middle" class="small" fill="#DBEAFE">Model</text>
    <rect x="558" y="444" width="64" height="34" rx="12" fill="url(#toolFill)" stroke="#8B5CF6"/>
    <text x="590" y="466" text-anchor="middle" class="small">Tool</text>
    <rect x="636" y="444" width="64" height="34" rx="12" fill="url(#testFill)" stroke="#14B8A6"/>
    <text x="668" y="466" text-anchor="middle" class="small" fill="#CCFBF1">pytest</text>
    <rect x="714" y="444" width="64" height="34" rx="12" fill="url(#modelFill)" stroke="#38BDF8"/>
    <text x="746" y="466" text-anchor="middle" class="small" fill="#DBEAFE">Model</text>

    <rect x="404" y="522" width="376" height="94" rx="22" fill="url(#throughputFill)" stroke="#14B8A6"/>
    <text x="430" y="548" class="small">评测吞吐</text>
    <text x="430" y="566" class="tiny">Evaluation Throughput</text>
    <text x="756" y="556" text-anchor="end" class="gain">+62%</text>
    <text x="430" y="601" class="mid">9.17</text>
    <path d="M522 591H584" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M584 591L574 584M584 591L574 598" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="610" y="601" class="mid">14.85</text>
    <text x="704" y="601" class="small">tasks/h</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="844" y="166" width="286" height="498" rx="24" class="card"/>
    <text x="874" y="206" class="panel-title">运行时加固</text>
    <text x="874" y="229" class="small">Runtime 加固</text>

    <rect x="874" y="260" width="226" height="74" rx="18" class="chip"/>
    <text x="894" y="286" class="label">Docker 镜像</text>
    <text x="894" y="311" class="small">冷拉取</text>
    <text x="1010" y="311" class="small" fill="#67E8F9">镜像预热</text>
    <path d="M960 307H998" stroke="#64748B" stroke-width="1.2"/>
    <path d="M998 307L990 301M998 307L990 313" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

    <rect x="874" y="356" width="226" height="74" rx="18" class="chip"/>
    <text x="894" y="382" class="label">uv Bootstrap</text>
    <text x="894" y="407" class="small">在线安装</text>
    <text x="1010" y="407" class="small" fill="#67E8F9">本地 Binary</text>
    <path d="M972 403H998" stroke="#64748B" stroke-width="1.2"/>
    <path d="M998 403L990 397M998 403L990 409" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

    <rect x="874" y="452" width="226" height="74" rx="18" class="chip"/>
    <text x="894" y="478" class="label">Runtime 资源</text>
    <text x="894" y="503" class="small">运行时漂移</text>
    <text x="1010" y="503" class="small" fill="#67E8F9">资源同步</text>
    <path d="M980 499H998" stroke="#64748B" stroke-width="1.2"/>
    <path d="M998 499L990 493M998 499L990 505" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

    <rect x="874" y="552" width="226" height="90" rx="22" fill="#0E1B1A" stroke="#14B8A6"/>
    <text x="902" y="600" class="big">100 / 100</text>
    <text x="902" y="620" class="small" fill="#99F6E4">有效评测</text>
    <text x="902" y="636" class="tiny" fill="#99F6E4">Valid Evaluations</text>
  </g>
</svg>
