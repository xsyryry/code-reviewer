  <rect x="43" y="37" width="1114" height="706" rx="27" stroke="url(#accentStroke)" stroke-opacity="0.28"/>

  <g class="font">
    <text x="82" y="84" class="mono" font-size="13" fill="#38BDF8">Inside One Agentic Review</text>
    <text x="82" y="120" class="title">一次真实 Agent 审查内部发生了什么？</text>
    <text x="82" y="150" class="subtitle">astropy__astropy-7166 · 32 steps · 12m18s</text>

    <g opacity="0.96">
