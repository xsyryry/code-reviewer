<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">一次真实 Agent 审查内部发生了什么？</title>
  <desc id="desc">astropy__astropy-7166 的 Agent Event Trace，按模型、工具、验证、决策四条泳道展示关键步骤、独立根因诊断、证据上下文累积和最终 Verifier reward。</desc>
  <defs>
    <linearGradient id="surface" x1="42" y1="36" x2="1158" y2="744" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#06131F"/>
    </linearGradient>
    <linearGradient id="decisionFill" x1="1032" y1="508" x2="1118" y2="668" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E7490"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="accentStroke" x1="0" y1="0" x2="1" y2="1">
