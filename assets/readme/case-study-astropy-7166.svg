      <rect x="994" y="528" width="80" height="34" rx="14" class="card"/>
      <text x="1034" y="543" text-anchor="middle" class="tiny">边界检查</text>
      <text x="1034" y="557" text-anchor="middle" class="micro" fill="#86EFAC">edge passed</text>

