      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .title { font-size: 30px; font-weight: 800; fill: #F8FAFC; letter-spacing: 0; }
      .subtitle { font-size: 14px; fill: #CBD5E1; }
      .section { font-size: 12px; font-weight: 780; letter-spacing: 0.08em; text-transform: uppercase; fill: #93C5FD; }
      .label { font-size: 15px; font-weight: 760; fill: #F1F5F9; }
      .body { font-size: 12px; fill: #CBD5E1; }
      .tiny { font-size: 10.5px; fill: #94A3B8; }
      .micro { font-size: 9.5px; fill: #94A3B8; }
      .lane { fill: #0B1220; stroke: #1E293B; stroke-width: 1; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1; }
      .chip { fill: #0F172A; stroke: #334155; stroke-width: 1; }
      .model { fill: #172554; stroke: #60A5FA; }
      .tool { fill: #1E1B4B; stroke: #8B5CF6; }
      .valid { fill: #052E2B; stroke: #14B8A6; }
